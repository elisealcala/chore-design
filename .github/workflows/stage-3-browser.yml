name: Design browser checks

on:
  pull_request:
    paths:
      - '.github/workflows/stage-3-browser.yml'
      - 'packages/tokens/**'
      - 'fixtures/**'
      - 'registry/**'
      - 'registry.json'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - 'playwright.registry.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-3-browser.yml'
      - 'packages/tokens/**'
      - 'fixtures/**'
      - 'registry/**'
      - 'registry.json'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - 'playwright.registry.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm registry:build
      - run: pnpm registry:fixtures
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: pnpm test:browser:run
      - run: pnpm test:registry
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-browser-evidence
          path: |
            test-results/browser/
            test-results/registry-browser/
          if-no-files-found: ignore
          retention-days: 3
